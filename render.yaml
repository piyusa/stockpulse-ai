services:
  - type: web
    name: stockpulse-ai
    runtime: ruby
    buildCommand: bundle install
    startCommand: ruby app.rb
    envVars:
      - key: USERS_FILE
        value: /tmp/stock_users.json
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: production
      - key: GROQ_API_KEY
        sync: false
